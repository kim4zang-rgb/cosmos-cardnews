<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:1080px; height:1350px; position:relative; overflow:hidden; background:#f4f3f1; font-family:'Noto Sans KR', sans-serif;">

  <!-- background photo -->
  <img src="point1-bg.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
  <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(244,243,241,0.35) 0%, rgba(244,243,241,0.78) 28%, rgba(244,243,241,0.96) 52%, #f4f3f1 100%);"></div>

  <!-- progress bar -->
  <div style="position:absolute; top:40px; left:72px; right:72px; display:flex; gap:6px;">
    <div style="flex:1; height:3px; background:#111010;"></div>
    <div style="flex:1; height:3px; background:#111010;"></div>
    <div style="flex:1; height:3px; background:#e3e0dc;"></div>
    <div style="flex:1; height:3px; background:#e3e0dc;"></div>
    <div style="flex:1; height:3px; background:#e3e0dc;"></div>
    <div style="flex:1; height:3px; background:#e3e0dc;"></div>
  </div>

  <!-- headline -->
  <div style="position:absolute; left:72px; right:72px; top:420px;">
    <div style="font-family:'Syne', 'Noto Sans KR', sans-serif; font-weight:800; font-size:76px; line-height:1.2; letter-spacing:-0.01em; color:#111010;">
      113억 원<br>해외 진출 지원
    </div>
    <div style="margin-top:40px; max-width:900px; font-size:40px; line-height:1.5; color:#57534e;">
      문화체육관광부 산하 한국콘텐츠진흥원(콘진원)이 국내 패션 디자이너 브랜드의 해외 진출을 지원하기 위해 113억 원 규모의 지원 사업을 추진한다고 밝혔다. 이번 지원은 국내 디자이너 브랜드가 해외 유통망에 진입하고 브랜드 인지도를 높이는 과정에서 겪는 비용 부담을 덜어주는 데 초점을 맞춘다.
    </div>
  </div>

  <!-- brand tick -->
  <div style="position:absolute; left:72px; bottom:64px; display:inline-flex; align-items:baseline; font-family:'Syne', sans-serif; font-weight:800; letter-spacing:-0.02em; font-size:39px; color:#111010;">
    cosmos<span style="display:inline-block; width:0.28em; height:0.28em; margin-left:0.06em; border-radius:50%; background:#111010; transform:translateY(0.05em);"></span>
  </div>

  <!-- photo credit -->
  <div style="position:absolute; left:72px; bottom:24px; font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.04em; color:rgba(17,16,16,0.35);">
    PHOTO — Branislav Rodman / Unsplash
  </div>

</div>
</x-dc>

</html>
