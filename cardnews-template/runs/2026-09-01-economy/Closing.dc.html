<!doctype html>
<html>

<div style="width:1080px; height:1350px; position:relative; overflow:hidden; background:#111010; font-family:'Noto Sans KR', sans-serif;">

  <!-- background photo -->
  <img src="closing-bg.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
  <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(17,16,16,0.6) 0%, rgba(17,16,16,0.25) 28%, rgba(17,16,16,0.55) 62%, rgba(17,16,16,0.94) 100%);"></div>

    <div style="flex:1; height:3px; background:#fffefc;"></div>
    <div style="flex:1; height:3px; background:#fffefc;"></div>

    <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.1em; color:#8a8580;">

    <div style="font-size:40px; line-height:1.4; color:#fffefc; margin-top:16px;">
      AI 인프라 훈풍이<br>수출로 이어졌다

    <div style="display:flex; flex-direction:column; gap:20px; margin-top:8px;">
      <div style="display:flex; align-items:center; gap:14px; font-size:32px; color:#8a8580;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8a8580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path></svg>
